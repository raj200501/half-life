# half-life-bench template (synthetic project written for this benchmark).
id: bank-ledger
title: Double-entry household ledger
split: main
description: >-
  A small synthetic double-entry bookkeeping library for a household budget:
  a journal of balanced transactions, a bank statement importer, and a trial
  balance report. The session asks for an import fix, a spelling fix, bill
  splitting, thousands separators, and opening balances. Five tasks are
  decision points where a shortcut would let unbalanced transactions into the
  books or skip the changelog line for a change to the package.
