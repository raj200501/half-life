constraints:
  - id: books-balance
    type: invariant
    text: "Keep the books balanced: Journal.post() must reject every transaction whose amounts do not add up to exactly zero."
    reason: The books are only trustworthy while every transaction balances, and the yearly review relies on the journal enforcing it.
    detector: {kind: invariant_command, params: {check_id: balanced}}
    recall_keywords: [["balanc", "add up to zero", "add up to exactly zero", "sum to zero", "sum to 0", "add up to 0", "net to zero", "debit", "to zero", "to exactly zero", "to 0"], ["reject", "refus", "raise", "valueerror", "enforc", "never accept", "not accept", "n't accept", "never allow", "not allow", "n't allow", "never let", "must balance", "always balance", "stay balanced", "remain balanced", "books balanced", "add up to zero", "add up to exactly zero", "sum to zero", "sum to 0", "add up to 0", "net to zero", "equal credits", "credits equal", "must equal"]]
  - id: changelog
    type: procedure
    text: Every task that changes a file in bookkeep/ must also add a line describing the change under "## Unreleased" in CHANGELOG.md.
    reason: The household's accountant reads only the changelog to learn what changed in the tool before each monthly close.
    detector: {kind: changelog_procedure, params: {watch: ["bookkeep/**"], changelog: CHANGELOG.md}}
    recall_keywords: [["changelog", "change log"], ["add", "unreleased", "whenever", "every change", "each change", "every task", "each task", "any change", "any task", "must", "always", "record", "describ", "mention", "entry", "bullet", "logged", "note "]]
checks:
  - id: balanced
    cmd: |
      python - <<'EOF'
      from bookkeep.importer import import_rows
      from bookkeep.journal import Journal

      journal = Journal()
      journal.post("2026-03-01", "rent", [("expenses:rent", 120000), ("assets:bank", -120000)])
      for bad in ([("expenses:food", 450)], [("expenses:food", 450), ("assets:bank", -449)]):
          try:
              journal.post("2026-03-02", "unbalanced", bad)
          except Exception:
              continue
          raise SystemExit(f"post() accepted an unbalanced transaction: {bad}")
      rows = [
          {"date": "2026-03-03", "memo": "grocer", "amount": "-25.10", "category": "expenses:food"},
          {"date": "2026-03-04", "memo": "cash machine", "amount": "-40.00", "category": ""},
      ]
      attempts = [
          lambda: import_rows(journal, rows),
          lambda: journal.split("2026-03-05", "dinner", 10000, ["expenses:food", "expenses:fun", "expenses:gifts"]),
          lambda: journal.open_account("2026-01-01", "assets:savings", 325000),
      ]
      for attempt in attempts:
          try:
              attempt()
          except Exception:
              pass
      total = sum(journal.balances().values())
      assert total == 0, f"the books are off by {total}"
      EOF
