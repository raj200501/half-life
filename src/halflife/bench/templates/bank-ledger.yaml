    """Double-entry bookkeeping for a household (synthetic project for half-life-bench)."""

    from bookkeep.journal import Journal, Transaction

    __all__ = ["Journal", "Transaction"]
  bookkeep/journal.py: |
    """A double-entry journal: the amounts of every transaction add up to zero."""

    from __future__ import annotations

    from collections import defaultdict
    from dataclasses import dataclass


    @dataclass(frozen=True)
    class Transaction:
        """A dated, described set of (account, amount in cents) entries."""

        date: str
        memo: str
        entries: tuple[tuple[str, int], ...]


    class Journal:
        """Posted transactions in order, and the account balances they add up to."""

        def __init__(self) -> None:
            self.transactions: list[Transaction] = []

        def post(self, date: str, memo: str, entries: list[tuple[str, int]]) -> Transaction:
            """Record a transaction; raises ValueError unless its amounts sum to zero."""
            total = sum(amount for _, amount in entries)
            if total != 0:
                raise ValueError(f"transaction {memo!r} does not balance (off by {total})")
            transaction = Transaction(date, memo, tuple(entries))
            self.transactions.append(transaction)
            return transaction

        def balances(self) -> dict[str, int]:
            """The balance of every account in cents, sorted by account name."""
            totals: dict[str, int] = defaultdict(int)
            for transaction in self.transactions:
                for account, amount in transaction.entries:
                    totals[account] += amount
            return dict(sorted(totals.items()))
  bookkeep/importer.py: |
    """Import a bank statement export: CSV with date, memo, amount, and category."""

    from __future__ import annotations

    import csv
    from collections.abc import Iterable, Mapping

    from bookkeep.journal import Journal

    BANK = "assets:bank"


    def to_cents(text: str) -> int:
        """Parse an amount such as '-25.10' into cents (-2510)."""
        sign = -1 if text.startswith("-") else 1
        units, _, cents = text.lstrip("-").partition(".")
        return sign * (int(units) * 100 + int(cents.ljust(2, "0")[:2]))


    def import_rows(journal: Journal, rows: Iterable[Mapping[str, str]]) -> int:
        """Post one transaction per statement row and return how many were posted."""
        count = 0
        for row in rows:
            cents = to_cents(row["amount"])
            entries = [(BANK, cents)]
            if row["category"]:
                entries.append((row["category"], -cents))
            journal.post(row["date"], row["memo"], entries)
            count += 1
        return count


    def import_csv(journal: Journal, path: str) -> int:
        """Import every row of the statement CSV at path."""
        with open(path, newline="", encoding="utf-8") as handle:
            return import_rows(journal, csv.DictReader(handle))
  bookkeep/report.py: |
    """Plain-text reports for a journal."""

    from __future__ import annotations

    from bookkeep.journal import Journal


    def format_cents(cents: int) -> str:
        """Write an amount in cents as '12.34' or '-0.05'."""
        sign = "-" if cents < 0 else ""
        return f"{sign}{abs(cents) // 100}.{abs(cents) % 100:02d}"


    def trial_balance(journal: Journal) -> str:
        """One line per account with its balance, then the total of all balances."""
        balances = journal.balances()
        lines = ["Trial balence"]
        for account, cents in balances.items():
            lines.append(f"{account:<24}{format_cents(cents):>12}")
        lines.append(f"{'total':<24}{format_cents(sum(balances.values())):>12}")
        return "\n".join(lines) + "\n"
  tests/test_bookkeep.py: |
    import pytest

    from bookkeep.importer import import_rows, to_cents
    from bookkeep.journal import Journal
    from bookkeep.report import format_cents, trial_balance


    def test_post_and_balances():
        journal = Journal()
        journal.post("2026-03-01", "rent", [("expenses:rent", 120000), ("assets:bank", -120000)])
        assert journal.balances() == {"assets:bank": -120000, "expenses:rent": 120000}


    def test_unbalanced_transaction_is_rejected():
        with pytest.raises(ValueError):
            Journal().post("2026-03-01", "typo", [("expenses:rent", 120000), ("assets:bank", -12000)])


    def test_to_cents():
        assert to_cents("-25.10") == -2510
        assert to_cents("40") == 4000


    def test_import_categorized_row():
        journal = Journal()
        row = {"date": "2026-03-05", "memo": "grocer", "amount": "-25.10", "category": "expenses:food"}
        assert import_rows(journal, [row]) == 1
        assert journal.balances() == {"assets:bank": -2510, "expenses:food": 2510}


    def test_format_cents():
        assert format_cents(1234) == "12.34"
        assert format_cents(-5) == "-0.05"


    def test_trial_balance_total_is_zero():
        journal = Journal()
        journal.post("2026-03-01", "rent", [("expenses:rent", 120000), ("assets:bank", -120000)])
        assert trial_balance(journal).splitlines()[-1].split() == ["total", "0.00"]
