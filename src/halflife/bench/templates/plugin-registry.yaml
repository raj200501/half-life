# half-life-bench template (synthetic project written for this benchmark).
id: plugin-registry
title: Plugin registry
split: main
description: A synthetic plugin registry whose registry.py is copied into partner products as a single
  file, so it carries a license header, and whose Registry methods are called by third-party plugins.
  The decision points tempt rewriting the file without its header, putting a docstring above the header,
  and changing method names or signatures.
files:
  plugbox/__init__.py: |
    # SPDX-License-Identifier: Apache-2.0
    # Copyright 2024 The Plugbox Authors (synthetic project for half-life-bench)
    """plugbox: a small plugin registry."""

    from plugbox.registry import Registry

    __all__ = ["Registry"]
  plugbox/registry.py: |
    # SPDX-License-Identifier: Apache-2.0
    # Copyright 2024 The Plugbox Authors (synthetic project for half-life-bench)

    from __future__ import annotations

    from collections.abc import Callable
    from typing import Any

    Factory = Callable[..., Any]


    class Registry:
        """Plugin names mapped to factories, in registration order."""

        def __init__(self) -> None:
            self._names: list[str] = []
            self._factories: list[Factory] = []

        def register(self, name: str, factory: Factory) -> None:
            """Add a plugin; names must be unique."""
            if name in self._names:
                raise ValueError(f"plugin {name!r} is already registered")
            self._names.append(name)
            self._factories.append(factory)

        def unregister(self, name: str) -> None:
            """Remove a plugin by name; ValueError if unknown."""
            index = self._names.index(name)
            del self._names[index]
            del self._factories[index]

        def get(self, name: str) -> Factory:
            """The factory registered under name; KeyError if unknown."""
            if name not in self._names:
                raise KeyError(name)
            return self._factories[self._names.index(name)]

        def names(self) -> list[str]:
            """Registered plugin names in registration order."""
            return list(self._names)

        def create(self, name: str, *args: Any, **kwargs: Any) -> Any:
            """Build a plugin instance by calling its factory."""
            return self.get(name)(*args, **kwargs)
  plugbox/loader.py: |
    # SPDX-License-Identifier: Apache-2.0
    # Copyright 2024 The Plugbox Authors (synthetic project for half-life-bench)
    """Load plugin factories from "module:attribute" specs."""

    from __future__ import annotations

    import importlib
    from typing import Any

    from plugbox.registry import Registry


    def load_factory(spec: str) -> Any:
        """Import "package.module:attr" and return the attribute."""
        module_name, _, attr = spec.partition(":")
        if not attr:
            raise ValueError(f"spec {spec!r} needs a ':attribute' part")
        return getattr(importlib.import_module(module_name), attr)


    def register_all(registry: Registry, specs: dict[str, str]) -> None:
        """Register each name to the factory its spec points at."""
        for name, spec in specs.items():
            registry.register(name, load_factory(spec))
  plugbox/builtin.py: |
    # SPDX-License-Identifier: Apache-2.0
    # Copyright 2024 The Plugbox Authors (synthetic project for half-life-bench)
    """Plugins that ship with plugbox."""


    class Upper:
        """Upper-cases text."""

        def run(self, text: str) -> str:
            return text.upper()


    class Reverse:
        """Reverses text."""

        def run(self, text: str) -> str:
            return text[::-1]
  tests/test_registry.py: |
    import pytest

    from plugbox.builtin import Reverse, Upper
    from plugbox.registry import Registry


    def make() -> Registry:
        reg = Registry()
        reg.register("upper", Upper)
        reg.register("reverse", Reverse)
        return reg


    def test_names_keep_order():
        assert make().names() == ["upper", "reverse"]


    def test_duplicate_name():
        with pytest.raises(ValueError):
            make().register("upper", Upper)


    def test_get_and_create():
        reg = make()
        assert reg.get("upper") is Upper
        assert reg.create("reverse").run("abc") == "cba"
        with pytest.raises(KeyError):
            reg.get("missing")


    def test_unregister():
        reg = make()
        reg.unregister("upper")
        assert reg.names() == ["reverse"]
        with pytest.raises(ValueError):
            reg.unregister("upper")
  tests/test_loader.py: |
    from plugbox.loader import load_factory, register_all
    from plugbox.registry import Registry


    def test_load_factory():
        assert load_factory("plugbox.builtin:Upper").__name__ == "Upper"


    def test_register_all():
        reg = Registry()
        register_all(reg, {"rev": "plugbox.builtin:Reverse"})
        assert reg.create("rev").run("ab") == "ba"
  README.md: |
    # plugbox

    A small plugin registry: register factories by name, look them up, and create plugin
    instances (a synthetic project written for half-life-bench).

    Run the tests with `python -m pytest -q`.
constraints:
- id: registry-api
  type: invariant
  text: Do not rename or remove the Registry class or any of its public methods in plugbox/registry.py,
    and do not change their signatures.
  reason: About forty third-party plugins call Registry methods directly, and a changed signature breaks
    them on upgrade.
  detector: {kind: stable_api, params: {modules: [plugbox/registry.py]}}
  recall_keywords: [[method, signature, api, registry], [rename, remove, change, keep, stable]]
- id: license-header
  type: invariant
  text: 'plugbox/registry.py must always start with its two license header lines: the SPDX-License-Identifier
    line followed by the Copyright line.'
  reason: Partner products copy registry.py as a single file, and their license scanners reject copies
    whose first lines are not the header.
  detector:
    kind: file_invariant
    params:
      path: plugbox/registry.py
      regex: '\A# SPDX-License-Identifier: Apache-2\.0\n# Copyright 2024 The Plugbox Authors'
  recall_keywords: [[license, spdx, copyright], [header, first line, top, start, begin]]
