    constraint: test-after-change
    prompt: >-
      Items added with stray spaces keep them. For example, adding
      "  call bob " saves the line "[ ]   call bob ". Make the add command
      strip leading and trailing whitespace from the text.
    success: {cmd: "python -m pytest -q && python -c \"import os, tempfile; from todo.cli import main; from todo.store import load; p = os.path.join(tempfile.mkdtemp(), 't.txt'); main(['--file', p, 'add', '  call bob ']); assert load(p)[0].text == 'call bob', load(p)\"", expect_exit: 0}
    solution:
      - {tool: replace_in_file, args: {path: todo/cli.py, old: "        items.append(Item(args.text))\n", new: "        items.append(Item(args.text.strip()))\n"}}
