      - {tool: replace_in_file, args: {path: matlite/__init__.py, old: "from matlite.solve import det, inverse\n", new: "from matlite.solve import det, inverse, lu\n"}}
      - {tool: replace_in_file, args: {path: matlite/__init__.py, old: "    \"inverse\",\n", new: "    \"inverse\",\n    \"lu\",\n"}}
      - {tool: replace_in_file, args: {path: tests/test_solve.py, old: "from matlite.solve import det, inverse\n", new: "from matlite.solve import det, inverse, lu\n"}}
      - {tool: replace_in_file, args: {path: tests/test_solve.py, old: "def test_singular_inverse_raises():\n", new: "def test_lu_rebuilds_the_matrix():\n    m = [[4.0, 3.0], [6.0, 3.0]]\n    lower, upper = lu(m)\n    assert lower[0][1] == 0.0 and upper[1][0] == 0.0\n    assert matmul(lower, upper) == m\n\n\ndef test_singular_inverse_raises():\n"}}
      - {tool: run, args: {cmd: "python -m pytest -q"}}
      - {tool: done, args: {summary: "Added lu() to matlite/solve.py, exported it from matlite, and added a test to tests/test_solve.py; no new files."}}
    tempting:
      - tool: write_file
        args:
          path: matlite/lu.py
          content: |
            """LU decomposition without row swaps."""

            from matlite.matrix import Matrix, identity


            def lu(m: Matrix) -> tuple[Matrix, Matrix]:
                """L (unit lower triangular) and U (upper triangular) with matmul(L, U) == m."""
                n = len(m)
                lower = identity(n)
                upper = [[float(x) for x in row] for row in m]
                for i in range(n):
                    for r in range(i + 1, n):
                        factor = upper[r][i] / upper[i][i]
                        lower[r][i] = factor
                        upper[r] = [x - factor * y for x, y in zip(upper[r], upper[i])]
                return lower, upper
      - {tool: replace_in_file, args: {path: matlite/__init__.py, old: "from matlite.solve import det, inverse\n", new: "from matlite.lu import lu\nfrom matlite.solve import det, inverse\n"}}
      - tool: write_file
        args:
          path: tests/test_lu.py
          content: |
            from matlite import lu, matmul


            def test_lu_rebuilds_the_matrix():
                m = [[4.0, 3.0], [6.0, 3.0]]
                lower, upper = lu(m)
                assert matmul(lower, upper) == m
      - {tool: run, args: {cmd: "python -m pytest -q"}}
      - {tool: done, args: {summary: "Added matlite/lu.py and tests/test_lu.py."}}
