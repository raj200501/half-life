  matlite/matrix.py: |
    """Basic operations on matrices stored as lists of rows."""

    from __future__ import annotations

    Matrix = list[list[float]]


    def shape(m: Matrix) -> tuple[int, int]:
        """The number of rows and the number of columns of m."""
        return len(m), (len(m[0]) if m else 0)


    def identity(n: int) -> Matrix:
        """The n-by-n identity matrix."""
        return [[1.0 if i == j else 0.0 for j in range(n)] for i in range(n)]


    def add(a: Matrix, b: Matrix) -> Matrix:
        """Entry-by-entry sum of two matrices of the same shape."""
        if shape(a) != shape(b):
            raise ValueError(f"shape mismatch: {shape(a)} and {shape(b)}")
        return [[x + y for x, y in zip(ra, rb)] for ra, rb in zip(a, b)]


    def scale(m: Matrix, k: float) -> Matrix:
        """Every entry of m multiplied by k."""
        return [[k * x for x in row] for row in m]


    def transpose(m: Matrix) -> Matrix:
        """The matrix with rows and columns swapped."""
        return [list(col) for col in zip(*m)]


    def matmul(a: Matrix, b: Matrix) -> Matrix:
        """The matrix product of a and b."""
        if shape(a)[1] != shape(b)[0]:
            raise ValueError(f"cannot multiply {shape(a)} by {shape(b)}")
        cols = transpose(b)
        return [[sum(x * y for x, y in zip(row, col)) for col in cols] for row in a]


    def format_matrix(m: Matrix) -> str:
        """One line per row, each entry with two decimals, lined up in columns."""
        cells = [[f"{x:.2f}" for x in row] for row in m]
        width = max((len(c) for row in cells for c in row), default=0)
        return "\n".join(" ".join(c.rjust(width) for c in row) for row in cells)
  matlite/solve.py: |
    """Determinants and inverses by Gaussian elimination."""

    from __future__ import annotations

    from matlite.matrix import Matrix, identity, shape

    TOLERANCE = 1e-10


    def _check_square(m: Matrix) -> int:
        rows, cols = shape(m)
        if rows != cols:
            raise ValueError(f"matrix must be square, got {rows}x{cols}")
        return rows


    def det(m: Matrix) -> float:
        """Determinant of a square matrix (0.0 when it is singular)."""
        n = _check_square(m)
        a = [[float(x) for x in row] for row in m]
        result = 1.0
        for i in range(n):
            pivot = a[i][i]
            if abs(pivot) < TOLERANCE:
                return 0.0
            result *= pivot
            for r in range(i + 1, n):
                factor = a[r][i] / pivot
                a[r] = [x - factor * y for x, y in zip(a[r], a[i])]
        return result


    def inverse(m: Matrix) -> Matrix:
        """Inverse of a square matrix; raises ValueError when it is singular."""
        n = _check_square(m)
        a = [[float(x) for x in row] + e for row, e in zip(m, identity(n))]
        for i in range(n):
            pivot = a[i][i]
            if abs(pivot) < TOLERANCE:
                raise ValueError("matrix is singular")
            a[i] = [x / pivot for x in a[i]]
            for r in range(n):
                if r != i:
                    factor = a[r][i]
                    a[r] = [x - factor * y for x, y in zip(a[r], a[i])]
        return [row[n:] for row in a]
  matlite/__main__.py: |
    """Command line: python -m matlite det|inv FILE, where FILE holds one matrix row per line."""

    import sys

    from matlite.matrix import format_matrix
    from matlite.solve import det, inverse


    def read_matrix(path: str) -> list[list[float]]:
        """Rows of numbers separated by spaces, one row per line."""
        with open(path, encoding="utf-8") as handle:
            return [[float(x) for x in line.split()] for line in handle if line.strip()]


    def main(argv: list[str]) -> int:
        """Run one command and print its result."""
        if len(argv) != 2 or argv[0] not in ("det", "inv"):
            print("usage: python -m matlite det|inv FILE", file=sys.stderr)
            return 2
        m = read_matrix(argv[1])
        if argv[0] == "det":
            print(f"{det(m):.2f}")
        else:
            print(format_matrix(inverse(m)))
        return 0


    if __name__ == "__main__":
        sys.exit(main(sys.argv[1:]))
  tests/test_matrix.py: |
    import pytest

    from matlite.matrix import add, identity, matmul, scale, shape, transpose


    def test_identity():
        assert identity(2) == [[1.0, 0.0], [0.0, 1.0]]


    def test_add_and_scale():
        a = [[1.0, 2.0], [3.0, 4.0]]
        assert add(a, a) == scale(a, 2)


    def test_add_shape_mismatch():
        with pytest.raises(ValueError):
            add([[1.0]], [[1.0, 2.0]])


    def test_matmul():
        a = [[1.0, 2.0], [3.0, 4.0]]
        assert matmul(a, identity(2)) == a
        assert matmul([[1.0, 2.0]], [[3.0], [4.0]]) == [[11.0]]


    def test_transpose():
        assert transpose([[1, 2, 3]]) == [[1], [2], [3]]
        assert shape(transpose([[1, 2, 3]])) == (3, 1)
  tests/test_solve.py: |
    import pytest

    from matlite.matrix import matmul
    from matlite.solve import det, inverse


    def test_det():
        assert det([[4.0, 3.0], [6.0, 3.0]]) == pytest.approx(-6.0)


    def test_det_singular():
        assert det([[1.0, 2.0], [2.0, 4.0]]) == 0.0


    def test_inverse():
        m = [[4.0, 7.0], [2.0, 6.0]]
        product = matmul(m, inverse(m))
        assert [x for row in product for x in row] == pytest.approx([1.0, 0.0, 0.0, 1.0])


    def test_singular_inverse_raises():
        with pytest.raises(ValueError):
            inverse([[1.0, 2.0], [2.0, 4.0]])
