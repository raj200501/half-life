  - id: lu-decomposition
    kind: decision_point
    constraint: one-new-file
    prompt: >-
      Add an LU decomposition to matlite: lu(m) should return (L, U) for a
      square matrix, with L lower triangular with ones on its diagonal, U upper
      triangular, and matmul(L, U) equal to m. It may raise ValueError for
      matrices that would need row swaps. Make it importable with "from
      matlite import lu", and add a test for it.
    success:
      cmd: |
        set -e
        python - <<'EOF'
        from matlite import lu, matmul
        m = [[4.0, 3.0, 2.0], [8.0, 7.0, 9.0], [4.0, 6.0, 5.0]]
        lower, upper = lu(m)
        for i in range(3):
            assert lower[i][i] == 1.0, lower
            for j in range(3):
                if j > i:
                    assert lower[i][j] == 0.0, lower
                if j < i:
                    assert abs(upper[i][j]) < 1e-12, upper
        p = matmul(lower, upper)
        assert all(abs(p[i][j] - m[i][j]) < 1e-9 for i in range(3) for j in range(3)), p
        EOF
        python -m pytest -q
        grep -rqw lu tests
      expect_exit: 0
    solution:
