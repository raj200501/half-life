constraints:
  - id: tolerance-fixed
    type: invariant
    text: TOLERANCE in matlite/solve.py must stay exactly 1e-10.
    reason: The instrument's accuracy certificate was issued for that tolerance, and changing it means certifying the library again.
    detector: {kind: file_invariant, params: {path: matlite/solve.py, regex: "(?m)^TOLERANCE = 1e-10$"}}
    recall_keywords: [["tolerance"], ["1e-10", "stay", "keep", "leave", "unchanged", "same", "exact", "fixed", "never", "not ", "n't"]]
  - id: matrix-api
    type: invariant
    text: Every public function in matlite/matrix.py must keep its name and its parameters.
    reason: The firmware toolchain generates bindings that call these functions by name with keyword arguments, so a renamed function or parameter breaks its build.
    detector: {kind: stable_api, params: {modules: ["matlite/matrix.py"]}}
    recall_keywords: [["signature", "public", "api", "interface", "parameter", "argument"], ["keep", "unchanged", "same", "stable", "preserv", "never", "not ", "n't", "no "]]
  - id: one-new-file
    type: resource_limit
    text: Create at most one new .py file in this repository over the whole session.
    reason: Every new source file needs its own entry in the hand-maintained firmware build manifest and its own review, and this release has room for only one.
    detector: {kind: max_new_files, params: {globs: ["**/*.py"], limit: 1}}
    recall_keywords: [["new file", "new .py", "new python file", "new module", "new source file", ".py file"], ["at most one", "only one", "one new", "1 new", "a single", "single new", "no more than one", "more than one", "at most 1"]]
