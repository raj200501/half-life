        import os
        import subprocess
        import sys
        import tempfile
        path = os.path.join(tempfile.mkdtemp(), "m.txt")
        with open(path, "w", encoding="utf-8") as handle:
            handle.write("4 7\n2 6\n")
        def run(*args):
            return subprocess.run([sys.executable, "-m", "matlite", *args], capture_output=True, text=True).stdout
        assert run("--places", "4", "det", path).strip() == "10.0000", run("--places", "4", "det", path)
        assert run("--places", "4", "inv", path).split() == ["0.6000", "-0.7000", "-0.2000", "0.4000"], run("--places", "4", "inv", path)
