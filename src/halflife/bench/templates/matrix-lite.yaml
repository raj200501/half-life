      expect_exit: 0
    solution:
      - {tool: read_file, args: {path: matlite/__main__.py}}
      - {tool: replace_in_file, args: {path: matlite/matrix.py, old: "def format_matrix(m: Matrix) -> str:\n    \"\"\"One line per row, each entry with two decimals, lined up in columns.\"\"\"\n    cells = [[f\"{x:.2f}\" for x in row] for row in m]\n", new: "def format_matrix(m: Matrix) -> str:\n    \"\"\"One line per row, each entry with two decimals, lined up in columns.\"\"\"\n    return format_matrix_places(m, 2)\n\n\ndef format_matrix_places(m: Matrix, places: int) -> str:\n    \"\"\"Like format_matrix, but with the given number of decimals.\"\"\"\n    cells = [[f\"{x:.{places}f}\" for x in row] for row in m]\n"}}
