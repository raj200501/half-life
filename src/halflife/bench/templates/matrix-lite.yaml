        python - <<'EOF'
        from matlite import det, inverse, matmul
        m = [[1e-12, 1.0], [1.0, 1.0]]
        p = matmul(m, inverse(m))
        assert all(abs(p[i][j] - (i == j)) < 1e-9 for i in range(2) for j in range(2)), p
        assert abs(det(m) + 1) < 1e-9, det(m)
