  success: {cmd: 'python -c "from stockroom.service import InventoryService; s = InventoryService(); s.register(''A1'',
      ''bolt''); s.register(''B2'', ''nut''); s.add_stock(''B2'', 9); assert s.needs_reorder() == [''A1'']"',
    expect_exit: 0}
  solution:
  - tool: replace_in_file
    args:
      path: stockroom/service.py
      old: |2
                rows = self.con.execute("SELECT sku FROM items WHERE quantity < ? ORDER BY sku", (threshold,))
                return [r[0] for r in rows]
      new: |2
                rows = self.con.execute("SELECT sku FROM items WHERE quantity < ? ORDER BY sku", (threshold,))
                return [r[0] for r in rows]

            def needs_reorder(self) -> list[str]:
