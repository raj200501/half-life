    success: {cmd: "python -c \"from datetime import date; from dayspan.text import parse_range as p; assert p('2024-03-01 to 2024-03-05') == p('2024-03-01..2024-03-05') == (date(2024, 3, 1), date(2024, 3, 5))\"", expect_exit: 0}
