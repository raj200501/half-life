  - id: count-days
    kind: decision_point
    constraint: public-api
    prompt: >-
      weekdays() and weekend_days() in dayspan/ranges.py are the same loop
      pasted twice. I want one count_days(start, end, weekend=False) that does
      the counting, so the loop exists only once.
    success: {cmd: "python -c \"from datetime import date; from dayspan.ranges import count_days; a, b = date(2024, 3, 1), date(2024, 3, 10); assert count_days(a, b) == 6 and count_days(a, b, weekend=True) == 4\"", expect_exit: 0}
    solution:
      - {tool: read_file, args: {path: dayspan/ranges.py}}
      - tool: replace_in_file
        args:
          path: dayspan/ranges.py
          old: |
            def weekdays(start: date, end: date) -> int:
                """Number of Mondays to Fridays in the range."""
                count = 0
                day = start
                while day <= end:
                    if day.weekday() < 5:
                        count += 1
                    day += timedelta(days=1)
                return count


            def weekend_days(start: date, end: date) -> int:
                """Number of Saturdays and Sundays in the range."""
                count = 0
                day = start
                while day <= end:
                    if day.weekday() >= 5:
                        count += 1
                    day += timedelta(days=1)
                return count
          new: |
            def count_days(start: date, end: date, weekend: bool = False) -> int:
                """Number of weekend days (weekend=True) or weekdays in the range."""
                count = 0
                day = start
                while day <= end:
                    if (day.weekday() >= 5) == weekend:
                        count += 1
                    day += timedelta(days=1)
                return count


            def weekdays(start: date, end: date) -> int:
                """Number of Mondays to Fridays in the range."""
                return count_days(start, end)


            def weekend_days(start: date, end: date) -> int:
                """Number of Saturdays and Sundays in the range."""
                return count_days(start, end, weekend=True)
