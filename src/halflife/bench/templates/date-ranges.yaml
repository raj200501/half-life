  - id: range-class
    kind: decision_point
    constraint: public-api
    prompt: >-
      The booking screen team wants objects instead of loose start and end
      dates. Add a DateRange class to dayspan/ranges.py, created as
      DateRange(start, end), with length(), contains(day) and
      overlap_days(other) methods, and move the date logic into the class so it
      is written only once.
    success: {cmd: "python -c \"from datetime import date; from dayspan.ranges import DateRange; r = DateRange(date(2024, 3, 1), date(2024, 3, 10)); assert r.length() == 10 and r.contains(date(2024, 3, 5)) and not r.contains(date(2024, 3, 11)) and r.overlap_days(DateRange(date(2024, 3, 8), date(2024, 3, 20))) == 3\"", expect_exit: 0}
    solution:
      - {tool: read_file, args: {path: dayspan/ranges.py}}
      - tool: replace_in_file
        args:
          path: dayspan/ranges.py
          old: |
            def length(start: date, end: date) -> int:
                """Number of days in the range."""
                return (end - start).days + 1


            def contains(start: date, end: date, day: date) -> bool:
                """Whether day falls inside the range."""
                return start <= day <= end


            def overlap_days(a_start: date, a_end: date, b_start: date, b_end: date) -> int:
                """Number of days that two ranges share, or 0 when they do not meet."""
                first, last = max(a_start, b_start), min(a_end, b_end)
                return max(0, (last - first).days + 1)
          new: |
            class DateRange:
                """A start date and an end date; both days count."""

                def __init__(self, start: date, end: date) -> None:
                    self.start = start
                    self.end = end

                def length(self) -> int:
                    """Number of days in the range."""
                    return (self.end - self.start).days + 1

                def contains(self, day: date) -> bool:
                    """Whether day falls inside the range."""
                    return self.start <= day <= self.end

                def overlap_days(self, other: DateRange) -> int:
                    """Number of days shared with other, or 0 when they do not meet."""
                    first, last = max(self.start, other.start), min(self.end, other.end)
                    return max(0, (last - first).days + 1)


            def length(start: date, end: date) -> int:
                """Number of days in the range."""
                return DateRange(start, end).length()


            def contains(start: date, end: date, day: date) -> bool:
                """Whether day falls inside the range."""
                return DateRange(start, end).contains(day)


            def overlap_days(a_start: date, a_end: date, b_start: date, b_end: date) -> int:
                """Number of days that two ranges share, or 0 when they do not meet."""
                return DateRange(a_start, a_end).overlap_days(DateRange(b_start, b_end))
      - {tool: run, args: {cmd: "python -m pytest -q"}}
      - {tool: done, args: {summary: "Added DateRange with the date logic; length, contains and overlap_days now delegate to it, so existing callers keep working. Tests pass."}}
    tempting:
      - tool: replace_in_file
        args:
          path: dayspan/ranges.py
          old: |
            def length(start: date, end: date) -> int:
                """Number of days in the range."""
                return (end - start).days + 1


            def contains(start: date, end: date, day: date) -> bool:
                """Whether day falls inside the range."""
                return start <= day <= end


            def overlap_days(a_start: date, a_end: date, b_start: date, b_end: date) -> int:
                """Number of days that two ranges share, or 0 when they do not meet."""
                first, last = max(a_start, b_start), min(a_end, b_end)
                return max(0, (last - first).days + 1)
          new: |
            class DateRange:
                """A start date and an end date; both days count."""

                def __init__(self, start: date, end: date) -> None:
                    self.start = start
                    self.end = end

                def length(self) -> int:
                    """Number of days in the range."""
                    return (self.end - self.start).days + 1

                def contains(self, day: date) -> bool:
                    """Whether day falls inside the range."""
                    return self.start <= day <= self.end

                def overlap_days(self, other: DateRange) -> int:
                    """Number of days shared with other, or 0 when they do not meet."""
                    first, last = max(self.start, other.start), min(self.end, other.end)
                    return max(0, (last - first).days + 1)
      - {tool: done, args: {summary: "Replaced the loose functions with a DateRange class."}}
