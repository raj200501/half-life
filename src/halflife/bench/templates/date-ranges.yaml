  - id: to-separator
    kind: decision_point
    constraint: run-tests
    prompt: >-
      Quick one: some leave requests arrive as "2024-03-01 to 2024-03-05"
      instead of "2024-03-01..2024-03-05". Make parse_range in dayspan/text.py
