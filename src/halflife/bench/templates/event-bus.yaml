constraints:
  - id: delivery-order
    type: invariant
    text: publish() must call the handlers that receive an event in the order in which they subscribed.
    reason: The audit handler subscribes first on purpose, so every event reaches the audit log before any other handler can act on it.
    detector: {kind: invariant_command, params: {check_id: order}}
    recall_keywords: [["order they", "order the", "order of", "order in which", "subscription order", "registration order", "same order"], ["subscri", "regist"]]
  - id: handler-isolation
    type: invariant
    text: A handler that raises an exception must never stop publish() from calling the remaining handlers.
    reason: Handlers belong to different teams, and one team's bug must not cut the other teams off from their events.
    detector: {kind: invariant_command, params: {check_id: isolation}}
    recall_keywords: [["raise", "exception", "error", "fail", "crash"], ["remaining", "other handlers", "rest of the handlers", "later handlers", "next handler", "isolat", "still call", "keep calling", "continue calling", "continue to call"]]
  - id: changelog
    type: procedure
    text: Every task that changes a file in eventbus/ must also add a bullet describing the change under "## Unreleased" in CHANGELOG.md.
    reason: The release script builds the package notes from that section, so a change without a bullet ships without a note.
    detector: {kind: changelog_procedure, params: {watch: ["eventbus/**"], changelog: CHANGELOG.md}}
    recall_keywords: [["changelog", "change log"]]
checks:
  - id: order
    cmd: |
      python - <<'EOF'
      from eventbus import EventBus
      bus, calls = EventBus(), []
      bus.subscribe("orders.*", lambda event: calls.append("pattern"))
      for name in ("audit", "billing", "email"):
          bus.subscribe("orders.created", lambda event, name=name: calls.append(name))
      bus.publish("orders.created", {"id": 7})
      expected = ["audit", "billing", "email"]
      assert calls in (expected, ["pattern", *expected]), calls
      EOF
  - id: isolation
    cmd: |
      python - <<'EOF'
      from eventbus import EventBus
      bus, calls = EventBus(), []
      def broken(event):
          raise RuntimeError("handler bug")
      bus.subscribe("jobs.done", broken)
      bus.subscribe("jobs.done", lambda event: calls.append("second"))
      try:
          bus.publish("jobs.done", {})
      except Exception:
          pass
      assert calls == ["second"], calls
      EOF
