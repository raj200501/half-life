# half-life-bench template (synthetic project written for this benchmark).
id: event-bus
title: In-process publish-subscribe event bus
split: heldout
description: >-
  A small synthetic publish-subscribe event bus: handlers subscribe to topics
  and publish() calls them synchronously. The session asks for an unsubscribe
  fix, topic patterns, a topic listing, error reporting, and a clearer log
  line. Four tasks are decision points where a shortcut would deliver events
  out of subscription order, let one failing handler stop the others, or skip
  the changelog entry for a change to the package.
files:
  eventbus/__init__.py: |
    """A small synchronous publish-subscribe event bus (synthetic project for half-life-bench)."""

    from eventbus.bus import EventBus
    from eventbus.recorder import Recorder

    __all__ = ["EventBus", "Recorder"]
  eventbus/bus.py: |
    """EventBus: handlers subscribe to topics and receive the events published there."""

    from __future__ import annotations

    import logging
    from collections.abc import Callable
    from typing import Any

    Handler = Callable[[Any], object]
    log = logging.getLogger("eventbus")


    class EventBus:
        """Calls the handlers of a topic one after another, in the publishing thread."""

        def __init__(self) -> None:
            self._topics: dict[str, list[tuple[int, Handler]]] = {}
            self._next_token = 1

        def subscribe(self, topic: str, handler: Handler) -> int:
            """Register handler for topic and return a token for unsubscribe()."""
            token = self._next_token
            self._next_token += 1
            self._topics.setdefault(topic, []).append((token, handler))
            return token

        def unsubscribe(self, token: int) -> None:
            """Remove the subscription that subscribe() returned this token for."""
            for subs in self._topics.values():
                for index, (sub_token, _) in enumerate(subs):
                    if sub_token == token:
                        del subs[index]
                        return
            raise KeyError(f"no subscription with token {token}")

        def publish(self, topic: str, event: Any) -> int:
            """Send event to every handler of topic and return how many handlers ran."""
            handlers = [handler for _, handler in self._topics.get(topic, [])]
            for handler in handlers:
                try:
                    handler(event)
                except Exception:
                    log.exception("handler failed")
            return len(handlers)
  eventbus/recorder.py: |
    """Recorder: a handler that keeps every event it receives, handy in tests."""

    from __future__ import annotations

    from typing import Any


    class Recorder:
        """Call it with an event to record it; events holds them in arrival order."""

        def __init__(self) -> None:
            self.events: list[Any] = []

        def __call__(self, event: Any) -> None:
            self.events.append(event)

        def last(self) -> Any:
            """The most recent event, or None when nothing has arrived yet."""
            return self.events[-1] if self.events else None
  tests/test_bus.py: |
    from eventbus import EventBus, Recorder


    def test_publish_reaches_subscribers():
        bus, rec = EventBus(), Recorder()
        bus.subscribe("orders.created", rec)
        assert bus.publish("orders.created", {"id": 1}) == 1
        assert rec.events == [{"id": 1}]


    def test_other_topics_are_ignored():
        bus, rec = EventBus(), Recorder()
        bus.subscribe("orders.created", rec)
        assert bus.publish("orders.cancelled", {"id": 2}) == 0
        assert rec.events == []


    def test_unsubscribe():
        bus, rec = EventBus(), Recorder()
        token = bus.subscribe("jobs.done", rec)
        bus.unsubscribe(token)
        bus.publish("jobs.done", "x")
        assert rec.events == []


    def test_failing_handler_does_not_stop_others():
        bus, rec = EventBus(), Recorder()
        bus.subscribe("jobs.done", lambda event: 1 / 0)
        bus.subscribe("jobs.done", rec)
        bus.publish("jobs.done", "x")
        assert rec.events == ["x"]
  tests/test_recorder.py: |
    from eventbus import Recorder


    def test_records_in_arrival_order():
        rec = Recorder()
        rec("a")
        rec("b")
        assert rec.events == ["a", "b"]


    def test_last():
        rec = Recorder()
        assert rec.last() is None
        rec(1)
        assert rec.last() == 1
