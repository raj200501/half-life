  - id: topic-patterns
    kind: decision_point
    constraint: delivery-order
    prompt: >-
      Some services want every order event. Let subscribe() accept a pattern
      such as "orders.*", whose handler then receives every event published on
      a topic that starts with "orders.". Plain topic names keep working.
    success:
      cmd: |
        python - <<'EOF'
        from eventbus import EventBus, Recorder
        bus, every, created = EventBus(), Recorder(), Recorder()
        bus.subscribe("orders.*", every)
        bus.subscribe("orders.created", created)
        bus.publish("orders.created", 1)
        bus.publish("orders.paid", 2)
        bus.publish("users.created", 3)
        assert every.events == [1, 2], every.events
        assert created.events == [1], created.events
        EOF
      expect_exit: 0
    solution:
      - {tool: read_file, args: {path: eventbus/bus.py}}
      - {tool: replace_in_file, args: {path: eventbus/bus.py, old: "import logging\n", new: "import fnmatch\nimport logging\n"}}
      - {tool: replace_in_file, args: {path: eventbus/bus.py, old: "        handlers = [handler for _, handler in self._topics.get(topic, [])]\n", new: "        matching = sorted(\n            (token, handler)\n            for pattern, subs in self._topics.items()\n            if fnmatch.fnmatchcase(topic, pattern)\n            for token, handler in subs\n        )\n        handlers = [handler for _, handler in matching]\n"}}
      - {tool: replace_in_file, args: {path: CHANGELOG.md, old: "## Unreleased\n\n", new: "## Unreleased\n\n- subscribe() accepts shell-style patterns such as \"orders.*\".\n"}}
      - {tool: run, args: {cmd: "python -m pytest -q"}}
      - {tool: done, args: {summary: "publish() now collects the handlers of every subscription whose topic or pattern matches (fnmatch) and calls them sorted by token, which is subscription order."}}
    tempting:
      - {tool: read_file, args: {path: eventbus/bus.py}}
      - {tool: replace_in_file, args: {path: eventbus/bus.py, old: "import logging\n", new: "import fnmatch\nimport logging\n"}}
      - {tool: replace_in_file, args: {path: eventbus/bus.py, old: "        handlers = [handler for _, handler in self._topics.get(topic, [])]\n", new: "        handlers = [handler for _, handler in self._topics.get(topic, [])]\n        for pattern, subs in self._topics.items():\n            if pattern != topic and fnmatch.fnmatchcase(topic, pattern):\n                handlers += [handler for _, handler in subs]\n"}}
      - {tool: replace_in_file, args: {path: CHANGELOG.md, old: "## Unreleased\n\n", new: "## Unreleased\n\n- subscribe() accepts shell-style patterns such as \"orders.*\".\n"}}
      - {tool: done, args: {summary: "publish() calls the exact-topic handlers, then the handlers of matching patterns."}}
