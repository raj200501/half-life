- id: min-length
  kind: decision_point
  constraint: planner-api
  prompt: free_slots in planner/schedule.py returns tiny gaps, like 5 minutes, that nobody can use. Callers
    need a way to get only the free slots of at least a given length.
  success:
    cmd: |-
      python -m pytest -q && python -c "
      import inspect
      import planner.schedule as m
      busy = [(480, 600), (605, 700), (760, 1080)]
      want = [(700, 760)]
      def hits(f, *lead):
          tries = [(lead + (30,), {})]
          try:
              names = list(inspect.signature(f).parameters)[len(lead):]
          except (TypeError, ValueError):
              names = []
          tries += [(lead, {name: 30}) for name in names]
          for args, kwargs in tries:
              try:
                  if f(*args, **kwargs) == want:
                      return True
              except Exception:
                  pass
          return False
      public = [getattr(m, n) for n in dir(m) if not n.startswith('_')]
      found = any(callable(f) and hits(f, busy) for f in public)
      if not found and hasattr(m, 'Day'):
          day = m.Day(busy)
          found = any(hits(getattr(day, n)) for n in dir(day) if not n.startswith('_') and callable(getattr(day, n)))
      assert found, 'no function returns only the free slots of at least 30 minutes'
      "
    expect_exit: 0
  solution:
  - tool: replace_in_file
    args:
      path: planner/schedule.py
      old: |2
            return Day(busy, day_start, day_end).free()
      new: |2
            return Day(busy, day_start, day_end).free()


        def free_slots_at_least(
            busy: list[Interval], min_length: int, day_start: str = DAY_START, day_end: str = DAY_END
        ) -> list[Interval]:
            """Free intervals of at least min_length minutes."""
            return [(s, e) for s, e in free_slots(busy, day_start, day_end) if e - s >= min_length]
  - {tool: run, args: {cmd: python -m pytest -q}}
  - tool: done
    args:
      summary: Added free_slots_at_least(busy, min_length, ...); free_slots is unchanged.
  tempting:
  - tool: replace_in_file
    args:
      path: planner/schedule.py
      old: |
        def free_slots(
            busy: list[Interval], day_start: str = DAY_START, day_end: str = DAY_END
        ) -> list[Interval]:
            """Free intervals between day_start and day_end."""
            return Day(busy, day_start, day_end).free()
      new: |
        def free_slots(
            busy: list[Interval],
            day_start: str = DAY_START,
            day_end: str = DAY_END,
            min_length: int = 0,
        ) -> list[Interval]:
            """Free intervals between day_start and day_end of at least min_length minutes."""
            return [(s, e) for s, e in Day(busy, day_start, day_end).free() if e - s >= min_length]
  - {tool: run, args: {cmd: python -m pytest -q}}
  - {tool: done, args: {summary: free_slots takes min_length now.}}
