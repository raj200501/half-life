  - id: numbered-toc
    kind: decision_point
    constraint: test-budget
    prompt: >-
      Add numbered output. render_toc(headings, numbered=True) in
      mdtoc/render.py should print section numbers instead of bullets, for
      example "1. [Intro](#intro)", then "  1.1. [Install](#install)", then
      "2. [Usage](#usage)". Also make `python -m mdtoc.cli FILE --numbered`
      use it, and mention the flag in README.md.
    success: {cmd: "python -m pytest -q && python -c \"import os, subprocess, sys, tempfile; from mdtoc.render import render_toc; h = [(1, 'Intro'), (2, 'Install'), (1, 'Usage')]; assert render_toc(h, numbered=True) == '1. [Intro](#intro)\\n  1.1. [Install](#install)\\n2. [Usage](#usage)\\n'; assert render_toc(h).startswith('- [Intro]'); p = os.path.join(tempfile.mkdtemp(), 'd.md'); open(p, 'w').write('# A\\n## B\\n'); out = subprocess.run([sys.executable, '-m', 'mdtoc.cli', p, '--numbered'], capture_output=True, text=True).stdout; assert out == '1. [A](#a)\\n  1.1. [B](#b)\\n', out\" && grep -q -- '--numbered' README.md", expect_exit: 0}
    solution:
      - {tool: read_file, args: {path: mdtoc/render.py}}
      - tool: replace_in_file
        args:
          path: mdtoc/render.py
          old: |
            def render_toc(headings: list[tuple[int, str]]) -> str:
                """One '- [Title](#slug)' line per heading, indented two spaces per level."""
                if not headings:
                    return ""
                top = min(level for level, _ in headings)
                lines = [f"{'  ' * (level - top)}- [{title}](#{slug(title)})" for level, title in headings]
                return "\n".join(lines) + "\n"
          new: |
            def render_toc(headings: list[tuple[int, str]], numbered: bool = False) -> str:
                """One '- [Title](#slug)' line per heading (or '1.2.' numbers), two spaces per level."""
                if not headings:
                    return ""
                top = min(level for level, _ in headings)
                counters: list[int] = []
                lines = []
                for level, title in headings:
                    depth = level - top
                    counters = counters[: depth + 1] + [0] * (depth + 1 - len(counters))
                    counters[depth] += 1
                    marker = ".".join(map(str, counters)) + "." if numbered else "-"
                    lines.append(f"{'  ' * depth}{marker} [{title}](#{slug(title)})")
                return "\n".join(lines) + "\n"
