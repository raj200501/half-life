    success: {cmd: "python -m pytest -q && python -c \"from mdtoc import extract_headings; from mdtoc.headings import extract_headings as e; assert e('# A') == [(1, 'A')]\"", expect_exit: 0}
    solution:
      - {tool: replace_in_file, args: {path: mdtoc/headings.py, old: "def parse_headings(text: str)", new: "def extract_headings(text: str)"}}
      - {tool: replace_in_file, args: {path: mdtoc/headings.py, old: "    return found\n", new: "    return found\n\n\n# Old name, kept so existing callers keep working.\nparse_headings = extract_headings\n"}}
