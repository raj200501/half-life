    success: {cmd: "python -m pytest -q", expect_exit: 0}
    solution:
      - {tool: run, args: {cmd: "python -m pytest -q tests/test_headings.py"}}
      - {tool: read_file, args: {path: tests/test_headings.py}}
      - {tool: replace_in_file, args: {path: mdtoc/headings.py, old: "HEADING = re.compile(r\"^(#{1,6})\\s+(.*)$\")", new: "HEADING = re.compile(r\"^(#{1,6})\\s+(.*?)(?:\\s+#+)?\\s*$\")"}}
      - {tool: replace_in_file, args: {path: mdtoc/headings.py, old: "    for line in text.splitlines():\n        match = HEADING.match(line)\n", new: "    in_fence = False\n    for line in text.splitlines():\n        if line.startswith(\"```\"):\n            in_fence = not in_fence\n            continue\n        match = None if in_fence else HEADING.match(line)\n"}}
