      - {tool: run, args: {cmd: "python -m pytest -q"}}
      - {tool: replace_in_file, args: {path: mdtoc/cli.py, old: "    with open(argv[1], encoding=\"utf-8\") as handle:\n        print(render_toc(parse_headings(handle.read())), end=\"\")\n", new: "    numbered = \"--numbered\" in argv[2:]\n    with open(argv[1], encoding=\"utf-8\") as handle:\n        print(render_toc(parse_headings(handle.read()), numbered=numbered), end=\"\")\n"}}
