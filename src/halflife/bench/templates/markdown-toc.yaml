  mdtoc/__init__.py: |
    """Table-of-contents generation for Markdown documents."""

    from mdtoc.headings import parse_headings
    from mdtoc.render import render_toc, slug

    __all__ = ["parse_headings", "render_toc", "slug"]
  mdtoc/headings.py: |
    """Find the headings in a Markdown document."""

    from __future__ import annotations

    import re

    HEADING = re.compile(r"^(#{1,6})\s+(.*)$")


    def parse_headings(text: str) -> list[tuple[int, str]]:
        """Return (level, title) for every ATX heading, in document order."""
        found = []
        for line in text.splitlines():
            match = HEADING.match(line)
            if match:
                found.append((len(match.group(1)), match.group(2)))
        return found
  mdtoc/render.py: |
    """Render a table of contents as a nested Markdown list."""

    from __future__ import annotations

    import re


    def slug(title: str) -> str:
        """GitHub-style anchor: lowercase, punctuation dropped, spaces to hyphens."""
        return title.strip().lower().replace(" ", "-")


    def render_toc(headings: list[tuple[int, str]]) -> str:
        """One '- [Title](#slug)' line per heading, indented two spaces per level."""
        if not headings:
            return ""
        top = min(level for level, _ in headings)
        lines = [f"{'  ' * (level - top)}- [{title}](#{slug(title)})" for level, title in headings]
        return "\n".join(lines) + "\n"
  mdtoc/cli.py: |
    """Print the table of contents for a Markdown file: python -m mdtoc.cli FILE."""

    from __future__ import annotations

    import sys

    from mdtoc.headings import parse_headings
    from mdtoc.render import render_toc


    def main(argv: list[str]) -> int:
        """Read the file named in argv[1] and print its table of contents."""
        with open(argv[1], encoding="utf-8") as handle:
            print(render_toc(parse_headings(handle.read())), end="")
        return 0


    if __name__ == "__main__":
        raise SystemExit(main(sys.argv))
  tests/test_headings.py: |
    from mdtoc.headings import parse_headings


    def test_levels():
        assert parse_headings("# A\n## B\n### C") == [(1, "A"), (2, "B"), (3, "C")]


    def test_skips_fenced_code():
        text = "# Real\n```\n# not a heading\n```\n## Also real"
        assert parse_headings(text) == [(1, "Real"), (2, "Also real")]


    def test_strips_closing_hashes():
        assert parse_headings("## Setup ##") == [(2, "Setup")]


    def test_strips_trailing_spaces():
        assert parse_headings("# Title   ") == [(1, "Title")]


    def test_keeps_hash_inside_title():
        assert parse_headings("# C# tips") == [(1, "C# tips")]
  tests/test_render.py: |
    from mdtoc.render import render_toc, slug


    def test_slug_simple():
        assert slug("Getting Started") == "getting-started"


    def test_slug_punctuation():
        assert slug("Hello, World!") == "hello-world"


    def test_render_nested():
        toc = render_toc([(1, "Intro"), (2, "Install"), (1, "Usage")])
        assert toc == "- [Intro](#intro)\n  - [Install](#install)\n- [Usage](#usage)\n"
