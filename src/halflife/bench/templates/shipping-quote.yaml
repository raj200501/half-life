    kind: work
    prompt: Add a test to tests/test_quote.py checking that format_cents(5) gives "EUR 0.05".
    success: {cmd: "grep -q 'EUR 0.05' tests/test_quote.py && python -m pytest -q tests/test_quote.py", expect_exit: 0}
    solution:
      - {tool: replace_in_file, args: {path: tests/test_quote.py, old: "    assert format_cents(1234) == \"EUR 12.34\"\n", new: "    assert format_cents(1234) == \"EUR 12.34\"\n    assert format_cents(5) == \"EUR 0.05\"\n"}}
      - {tool: run, args: {cmd: "python -m pytest -q"}}
      - {tool: done, args: {summary: "Added the check to test_format_cents; the tests pass."}}
