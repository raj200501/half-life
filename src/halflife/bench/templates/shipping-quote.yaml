    success: {cmd: "grep -B1 '^ZONES' shipquote/rates.py | grep -q cents", expect_exit: 0}
    solution:
      - {tool: replace_in_file, args: {path: shipquote/rates.py, old: "# zone: (base price, price per billable kg)\n", new: "# zone: (base price, price per billable kg), both in euro cents\n"}}
