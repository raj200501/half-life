  prompt: For tile hit-testing, Rect.contains in geokit/shapes.py has to treat the right and bottom edges
    as outside, so a point on a shared edge belongs to only one tile. The left and top edges still count
    as inside.
  success: {cmd: 'python -c "from geokit.shapes import Rect; r = Rect(0, 0, 2, 2); assert r.contains((0,
      0)) and r.contains((1, 1)); assert not r.contains((2, 1)) and not r.contains((1, 2))"', expect_exit: 0}
  solution:
