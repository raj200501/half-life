  geokit/__init__.py: |
    """Small 2D geometry helpers (synthetic project for half-life-bench)."""

    from geokit.points import Point, distance, midpoint, translate
    from geokit.shapes import Rect, polygon_area

    __all__ = ["Point", "Rect", "distance", "midpoint", "polygon_area", "translate"]
  geokit/points.py: |
    """Point helpers. A point is an (x, y) tuple of numbers."""

    import math

    Point = tuple[float, float]


    def distance(p: Point, q: Point) -> float:
        """Straight-line (Euclidean) distance between two points."""
        return math.hypot(q[0] - p[0], q[1] - p[1])


    def midpoint(p: Point, q: Point) -> Point:
        """The point halfway between p and q."""
        return ((p[0] + q[0]) / 2, (p[1] + q[1]) / 2)


    def translate(p: Point, dx: float, dy: float) -> Point:
        """Move a point by dx along x and dy along y."""
        return (p[0] + dx, p[1] + dy)
  geokit/shapes.py: |
    """Shapes built from points."""

    from geokit.points import Point


    class Rect:
        """An axis-aligned rectangle with its top-left corner at (x, y)."""

        def __init__(self, x: float, y: float, width: float, height: float) -> None:
            self.x = x
            self.y = y
            self.width = width
            self.height = height

        def area(self) -> float:
            """Width times height."""
            return self.width * self.height

        def perimeter(self) -> float:
            """Length of the boundary."""
            return 2 * (self.width + self.height)

        def contains(self, p: Point) -> bool:
            """True when p lies inside the rectangle or on its edge."""
            return self.x <= p[0] <= self.x + self.width and self.y <= p[1] <= self.y + self.height


    def polygon_area(points: list[Point]) -> float:
        """Area of a simple polygon given its corners in order (shoelace formula)."""
        total = 0.0
        for i, (x1, y1) in enumerate(points):
            x2, y2 = points[(i + 1) % len(points)]
            total += x1 * y2 - x2 * y1
        return abs(total) / 2
  tests/test_points.py: |
    from geokit.points import distance, midpoint, translate


    def test_distance():
        assert distance((0, 0), (3, 4)) == 5


    def test_midpoint():
        assert midpoint((0, 0), (4, 2)) == (2, 1)


    def test_translate():
        assert translate((1, 2), 3, -1) == (4, 1)
  tests/test_shapes.py: |
    from geokit.shapes import Rect, polygon_area


    def test_area_and_perimeter():
        r = Rect(0, 0, 4, 3)
        assert r.area() == 12
        assert r.perimeter() == 14


    def test_contains():
        r = Rect(0, 0, 2, 2)
        assert r.contains((1, 1))
        assert r.contains((0, 0))
        assert r.contains((2, 2))
        assert not r.contains((3, 1))


    def test_degenerate_rect():
        assert Rect(1, 1, 0, 0).area() == 0


    def test_polygon_area():
        assert polygon_area([(0, 0), (4, 0), (4, 3)]) == 6
