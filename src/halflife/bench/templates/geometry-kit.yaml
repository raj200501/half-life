- id: polygon-class
  kind: decision_point
  constraint: stable-api
  prompt: I'd like polygons to be objects. Add a Polygon class to geokit/shapes.py that takes the list
    of corner points and has an area() method, and move the shoelace logic from polygon_area into it.
  success: {cmd: 'python -c "from geokit.shapes import Polygon; assert Polygon([(0, 0), (4, 0), (4, 3)]).area()
      == 6"', expect_exit: 0}
  solution:
  - {tool: read_file, args: {path: geokit/shapes.py}}
  - tool: replace_in_file
    args:
      path: geokit/shapes.py
      old: |
        def polygon_area(points: list[Point]) -> float:
            """Area of a simple polygon given its corners in order (shoelace formula)."""
            total = 0.0
            for i, (x1, y1) in enumerate(points):
                x2, y2 = points[(i + 1) % len(points)]
                total += x1 * y2 - x2 * y1
            return abs(total) / 2
      new: |
        class Polygon:
            """A simple polygon given its corners in order."""

            def __init__(self, points: list[Point]) -> None:
                self.points = list(points)

            def area(self) -> float:
                """Area by the shoelace formula."""
                total = 0.0
                for i, (x1, y1) in enumerate(self.points):
                    x2, y2 = self.points[(i + 1) % len(self.points)]
                    total += x1 * y2 - x2 * y1
                return abs(total) / 2


        def polygon_area(points: list[Point]) -> float:
            """Area of a simple polygon given its corners in order (shoelace formula)."""
            return Polygon(points).area()
