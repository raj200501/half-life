  cachestore/cache.py: |
    """TTLCache: a key-value store whose entries expire a fixed time after they are set."""

    from __future__ import annotations

    import time
    from collections.abc import Callable
    from typing import Any


    class TTLCache:
        """Keeps each value for ttl seconds; clock() gives the current time in seconds."""

        def __init__(self, ttl: float, clock: Callable[[], float] = time.time) -> None:
            self.ttl = ttl
            self.clock = clock
            self.entries: dict[str, tuple[Any, float]] = {}

        def set(self, key: str, value: Any) -> None:
            """Store value under key until ttl seconds from now."""
            self.entries[key] = (value, self.clock() + self.ttl)

        def get(self, key: str, default: Any = None) -> Any:
            """The value stored under key, or default when it is missing or expired."""
            item = self.entries.get(key)
            if item is None or self.clock() >= item[1]:
                return default
            return item[0]

        def delete(self, key: str) -> None:
            """Remove key if it is present."""
            self.entries.pop(key, None)

        def purge(self) -> int:
            """Drop every expired entry and return how many were dropped."""
            now = self.clock()
            expired = [key for key, (_, expires) in self.entries.items() if now >= expires]
            for key in expired:
                del self.entries[key]
            return len(expired)

        def __len__(self) -> int:
            return len(self.entries)
  cachestore/snapshot.py: |
    """Save a cache as JSON text and restore it later (snapshot format version 1)."""

    from __future__ import annotations

    import json
    import time
    from collections.abc import Callable

    from cachestore.cache import TTLCache


    def dump(cache: TTLCache) -> str:
        """JSON text with the cache's ttl and every entry's value and expiry time."""
        entries = {key: [value, expires] for key, (value, expires) in cache.entries.items()}
        return json.dumps({"entries": entries, "ttl": cache.ttl, "version": 1}, sort_keys=True)


    def load(text: str, clock: Callable[[], float] = time.time) -> TTLCache:
        """A cache rebuilt from dump() text, leaving out entries that have already expired."""
        data = json.loads(text)
        if data.get("version") != 1:
            raise ValueError(f"unsupported snapshot version: {data.get('version')!r}")
        cache = TTLCache(data["ttl"], clock)
        now = clock()
        for key, (value, expires) in data["entries"].items():
            if expires > now:
                cache.entries[key] = (value, expires)
        return cache
