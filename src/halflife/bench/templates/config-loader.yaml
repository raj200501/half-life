      - {tool: done, args: {summary: "Added an Example section."}}
  - id: get-path
    kind: work
    prompt: Add get_path(config, dotted, default=None) to confload/merge.py so get_path(c, "server.port") returns c["server"]["port"], or default when a key is missing.
    success: {cmd: "python -c \"from confload.merge import get_path; c = {'server': {'port': 1}}; assert get_path(c, 'server.port') == 1 and get_path(c, 'server.x', 5) == 5 and get_path(c, 'a.b') is None\"", expect_exit: 0}
    solution:
      - {tool: replace_in_file, args: {path: confload/merge.py, old: "            result[key] = value\n    return result\n", new: "            result[key] = value\n    return result\n\n\ndef get_path(config: dict, dotted: str, default: object = None) -> object:\n    \"\"\"Look up a dotted key such as 'server.port', or return default.\"\"\"\n    node: object = config\n    for key in dotted.split(\".\"):\n        if not isinstance(node, dict) or key not in node:\n            return default\n        node = node[key]\n    return node\n"}}
      - {tool: done, args: {summary: "Added get_path."}}
