            """Fixed-window limiter."""

            import time


            class FixedWindow:
                def __init__(self, limit, length, clock=time.monotonic):
                    self.limit, self.length, self.clock = limit, length, clock
                    self.window, self.count = None, 0

                def try_acquire(self):
                    window = int(self.clock() // self.length)
                    if window != self.window:
                        self.window, self.count = window, 0
                    self.count += 1
                    return self.count <= self.limit
      - tool: write_file
        args:
          path: ratelimit/sliding_log.py
          content: |
            """Sliding-log limiter."""

            import time
            from collections import deque


            class SlidingLog:
                def __init__(self, limit, length, clock=time.monotonic):
                    self.limit, self.length, self.clock = limit, length, clock
                    self.times = deque()

                def try_acquire(self):
                    now = self.clock()
                    while self.times and self.times[0] <= now - self.length:
                        self.times.popleft()
                    if len(self.times) < self.limit:
                        self.times.append(now)
                        return True
                    return False
