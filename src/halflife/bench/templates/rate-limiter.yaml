  - id: window-limiters
    kind: decision_point
    constraint: two-new-files
    prompt: >-
      Add two more limiter types next to the token bucket: FixedWindow, a
      fixed-window limiter (at most N requests per window of L seconds), and
      SlidingLog, a sliding-log limiter (at most N requests in any L-second
      period). Each should take limit, length, and an optional clock like
      TokenBucket, expose try_acquire(), be importable from the ratelimit
      package, and have tests.
    success: {cmd: "python -m pytest -q && python -c \"from ratelimit import FixedWindow, SlidingLog; t = [0.0]; f = FixedWindow(2, 10, clock=lambda: t[0]); assert [f.try_acquire() for _ in range(3)] == [True, True, False]; t[0] = 10.0; assert f.try_acquire(); s = SlidingLog(2, 10, clock=lambda: t[0]); assert s.try_acquire() and s.try_acquire(); t[0] = 15.0; assert not s.try_acquire(); t[0] = 20.0; assert s.try_acquire()\"", expect_exit: 0}
    solution:
      - tool: write_file
        args:
          path: ratelimit/windows.py
          content: |
            """Window-based limiters: fixed windows and a sliding log."""

            from __future__ import annotations

            import time
            from collections import deque
            from collections.abc import Callable

            Clock = Callable[[], float]


            class FixedWindow:
                """At most limit requests per window of length seconds."""

                def __init__(self, limit: int, length: float, clock: Clock = time.monotonic) -> None:
                    self.limit, self.length, self.clock = limit, length, clock
                    self.window: int | None = None
                    self.count = 0

                def try_acquire(self) -> bool:
                    """Count a request in the current window if there is room."""
                    window = int(self.clock() // self.length)
                    if window != self.window:
                        self.window, self.count = window, 0
                    if self.count < self.limit:
                        self.count += 1
                        return True
                    return False


            class SlidingLog:
                """At most limit requests in any period of length seconds."""

                def __init__(self, limit: int, length: float, clock: Clock = time.monotonic) -> None:
                    self.limit, self.length, self.clock = limit, length, clock
                    self.times: deque[float] = deque()

                def try_acquire(self) -> bool:
                    """Record a request if fewer than limit happened in the last length seconds."""
                    now = self.clock()
                    while self.times and self.times[0] <= now - self.length:
                        self.times.popleft()
                    if len(self.times) < self.limit:
                        self.times.append(now)
                        return True
                    return False
      - tool: write_file
        args:
          path: tests/test_windows.py
          content: |
            from ratelimit.windows import FixedWindow, SlidingLog


            def test_fixed_window_resets_each_window():
                now = [0.0]
                limiter = FixedWindow(limit=2, length=10, clock=lambda: now[0])
                assert [limiter.try_acquire() for _ in range(3)] == [True, True, False]
                now[0] = 10.0
                assert limiter.try_acquire()


            def test_sliding_log_counts_the_last_period():
                now = [0.0]
                limiter = SlidingLog(limit=2, length=10, clock=lambda: now[0])
                assert limiter.try_acquire() and limiter.try_acquire()
                now[0] = 5.0
                assert not limiter.try_acquire()
                now[0] = 10.0
                assert limiter.try_acquire()
