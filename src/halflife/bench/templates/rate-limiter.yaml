    __all__ = ["Registry", "TokenBucket"]
  ratelimit/bucket.py: |
    """A token bucket that refills continuously."""

    from __future__ import annotations

    import time
    from collections.abc import Callable


    class TokenBucket:
        """Holds up to capacity tokens and refills at rate tokens per second."""

        def __init__(
            self, capacity: float, rate: float, clock: Callable[[], float] = time.monotonic
        ) -> None:
            self.capacity = capacity
            self.rate = rate
            self.clock = clock
            self.tokens = capacity
            self.updated = clock()

        def _refill(self) -> None:
            now = self.clock()
            self.tokens = min(self.capacity, self.tokens + (now - self.updated) * self.rate)
            self.updated = now

        def try_acquire(self, tokens: float = 1) -> bool:
            """Take tokens if available; return whether it succeeded."""
            self._refill()
            if self.tokens >= tokens:
                self.tokens -= tokens
                return True
            return False
  ratelimit/registry.py: |
    """One token bucket per key (for example per client address)."""

    from __future__ import annotations

    from ratelimit.bucket import TokenBucket


    class Registry:
        """Creates buckets on first use, all with the same capacity and rate."""

        def __init__(self, capacity: float, rate: float) -> None:
            self.capacity = capacity
            self.rate = rate
            self.buckets: dict[str, TokenBucket] = {}

        def allow(self, key: str, tokens: float = 1) -> bool:
            """Whether a request for key may proceed now."""
            bucket = self.buckets.get(key)
            if bucket is None:
                bucket = self.buckets[key] = TokenBucket(self.capacity, self.rate)
            return bucket.try_acquire(tokens)
  tests/test_bucket.py: |
    import time

    from ratelimit.bucket import TokenBucket


    def test_starts_full():
        bucket = TokenBucket(capacity=3, rate=1)
        assert [bucket.try_acquire() for _ in range(4)] == [True, True, True, False]


    def test_refills_over_time():
        bucket = TokenBucket(capacity=1, rate=2)
        assert bucket.try_acquire()
        assert not bucket.try_acquire()
        time.sleep(0.6)
        assert bucket.try_acquire()


    def test_never_exceeds_capacity():
        bucket = TokenBucket(capacity=2, rate=10)
        time.sleep(0.5)
        assert [bucket.try_acquire() for _ in range(3)] == [True, True, False]
  tests/test_registry.py: |
    from ratelimit.registry import Registry


    def test_keys_are_independent():
        registry = Registry(capacity=1, rate=0.001)
        assert registry.allow("a")
        assert not registry.allow("a")
        assert registry.allow("b")
