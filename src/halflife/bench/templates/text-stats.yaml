- id: add-longest
  kind: work
  prompt: Add longest_word(text) to wordstat/stats.py returning the longest word (the first one on ties),
    or an empty string for empty text.
  success: {cmd: python -c "from wordstat.stats import longest_word as f; assert f('a bb cc') == 'bb'
      and f('') == ''", expect_exit: 0}
  solution:
  - tool: replace_in_file
    args:
      path: wordstat/stats.py
      old: |2
            return len(words(text))
      new: |2
            return len(words(text))


        def longest_word(text: str) -> str:
            """The longest word, the first one on ties, or '' for empty text."""
            return max(words(text), key=len, default="")
  - {tool: run, args: {cmd: python -m pytest -q}}
  - {tool: done, args: {summary: Added longest_word.}}
