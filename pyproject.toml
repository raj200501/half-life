[project]
name = "halflife"
version = "0.0.1"
description = "Survival analysis of constraint adherence in long agent sessions, with mitigations for real agent tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raj Kashikar" }]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local open-weight inference (CPU wheels from the llama-cpp-python index).
local = ["llama-cpp-python>=0.3.16", "jinja2>=3.1"]

[project.scripts]
halflife-doctor = "halflife.doctor:main"
halflife-guard = "halflife.kit.guard:main"
halflife-pin = "halflife.kit.pin:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "cmarkgfm>=2024.1",
]

[[tool.uv.index]]
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-cpu" }

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halflife"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["halflife"]
branch = true
# Adapters that need external services may be listed here only if
# tests/contract/test_<module>.py and tests/fixtures/<module>/ exist (gate G1).
omit = []

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/BUILD_BRIEF.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/halflife"]
