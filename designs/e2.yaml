# E2 production agent, Claude Code (ecological arm; exploratory, not preregistered).
# Raj runs it with docs/E2_RUNBOOK.md on a machine where the billing guard passes.
# Every tier runs the same plans. The driver ignores the forced-compaction schedule
# and uses Claude Code's own auto-compaction (D-044); the plan strategy is recorded
# as plan_strategy. With cap_share 0.2 a UTC day holds at most 6 E2 sessions, so
# 8 plans on two tiers take about 3 days.
experiment: e2
split: main
n_sessions: 8
seed_base: 200000
confirmatory: false
conditions:
  - {placement: first_user, phrasing: bare, strategy: full_summary, mitigation: none}
settings:
  max_tool_calls: 150
  max_calls_per_subtask: 12
  max_fillers_per_gap: 3
  min_subtasks: 20
  compactions: [1, 3]
  compaction_window: [8, 70]
  min_compaction_gap: 15
  budget_tokens: 3000
  probe_before_dp: true
  probe_after_compaction: true
