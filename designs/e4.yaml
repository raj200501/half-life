# E4 mitigations on held-out templates (to be preregistered in prereg/0003-e4.md before any
# E4 data; not committed yet). Rules in the first user message, full-summary compaction with a
# randomized schedule; the mitigation arm is assigned by blocked randomization.
experiment: e4
split: heldout
n_sessions: 48
seed_base: 400000
confirmatory: true
conditions:
  - {placement: first_user, phrasing: bare, strategy: full_summary, mitigation: none}
  - {placement: first_user, phrasing: bare, strategy: full_summary, mitigation: guard}
  - {placement: first_user, phrasing: bare, strategy: full_summary, mitigation: pin}
  - {placement: first_user, phrasing: bare, strategy: full_summary, mitigation: preserve}
  - {placement: first_user, phrasing: bare, strategy: full_summary, mitigation: reinject}
  - {placement: first_user, phrasing: bare, strategy: full_summary, mitigation: selfcheck}
settings:
  max_tool_calls: 150
  max_calls_per_subtask: 12
  max_fillers_per_gap: 3
  min_subtasks: 20
  compactions: [1, 2]
  compaction_window: [8, 70]
  min_compaction_gap: 15
  budget_tokens: 3000
